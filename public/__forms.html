<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>forms</title></head>
  <body>
    <!-- Netlify Forms がデプロイ時にフォーム定義を検出するための静的ファイルです。削除しないでください。 -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="type" />
      <input name="company" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="agree" />
    </form>
  </body>
</html>
